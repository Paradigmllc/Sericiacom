name: sericia-medusa-preview
x-medusa: &medusa
  image: ${MEDUSA_IMAGE:?Set the verified image tag}
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - ${SERICIA_DATA_ROOT:?Set the dedicated volume path}/uploads:/app/static
  networks: [commerce]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sericia_medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random password}
    volumes:
      - ${SERICIA_DATA_ROOT}/postgres:/var/lib/postgresql/data
    networks: [commerce]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U medusa -d sericia_medusa']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set a random password}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$${REDISCLI_AUTH}"']
    volumes:
      - ${SERICIA_DATA_ROOT}/redis:/data
    networks: [commerce]
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    <<: *medusa
    environment:
      MEDUSA_WORKER_MODE: server
      STRIPE_ENABLED: 'false'
      SERICIA_ORDER_EMAILS_ENABLED: 'false'
      MEDUSA_DISABLE_TELEMETRY: 'true'
    ports: ['127.0.0.1:19000:9000']
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:9000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  worker:
    <<: *medusa
    environment:
      MEDUSA_WORKER_MODE: worker
      STRIPE_ENABLED: 'false'
      SERICIA_ORDER_EMAILS_ENABLED: 'false'
      MEDUSA_DISABLE_TELEMETRY: 'true'
    mem_limit: 1g
    cpus: 0.5
networks:
  commerce:
